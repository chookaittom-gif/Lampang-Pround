# Lampang Pround — Cloudflare Worker
# ทุก environment มี D1 แยกกัน; local ใช้ R2, staging/production ใช้ GAS Drive adapter
# ก่อน deploy ต้องสร้างทรัพยากรจริงก่อน แล้วใส่ database_id ให้ครบ:
#   npx wrangler d1 create lampang-pround            (และ -staging / -prod)
# Secrets (ใส่ทีละ env): npx wrangler secret put GAS_DRIVE_ADAPTER_TOKEN --env staging

name = "lampang-pround-dev"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ฝังฟอนต์ Sarabun เป็น ArrayBuffer สำหรับ pdf-lib
rules = [
  { type = "Data", globs = ["**/*.ttf"], fallthrough = false }
]

[vars]
APP_NAME = "ระบบฐานข้อมูล Lampang Pround"
ORG_NAME = "สำนักงานพัฒนาชุมชน"
SESSION_TTL_SECONDS = "21600"
GUEST_ACCESS_TTL_SECONDS = "21600"
# Fallback ระหว่างรอพิสูจน์ PDF parity (Q1): ถ้าตั้งค่าไว้ /api/export/pdf จะ proxy ไปหา GAS
GAS_WEB_APP_URL = ""
# local ใช้ R2; staging/production override เป็น drive
IMAGE_STORAGE = "r2"
# ตั้งค่าเป็น URL /exec หลัง deploy GAS Drive adapter
GAS_DRIVE_ADAPTER_URL = ""
PDF_NATIVE = ""
# Origin ของ frontend ตอน dev (Vite 5173) — production ปล่อยว่าง (same-origin)
DEV_ALLOWED_ORIGIN = "http://localhost:5173"

[assets]
directory = "../frontend/dist"
binding = "STATIC"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "lampang-pround"
database_id = "TODO_LOCAL_D1_ID"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "lampang-pround-assets"
# env.staging/env.production intentionally omit this binding; Wrangler may warn
# because the top-level local R2 binding is not inherited by Drive-only envs.

[env.staging]
name = "lampang-pround-staging"

[env.staging.vars]
APP_NAME = "ระบบฐานข้อมูล Lampang Pround"
ORG_NAME = "สำนักงานพัฒนาชุมชน"
SESSION_TTL_SECONDS = "21600"
GUEST_ACCESS_TTL_SECONDS = "21600"
GAS_WEB_APP_URL = ""
IMAGE_STORAGE = "drive"
GAS_DRIVE_ADAPTER_URL = "https://script.google.com/macros/s/AKfycbzDFyTxomXVOG6cbxIQM8Zp_2DIXENHbk0udZ_S6LWGQbws8pvyjQ21BzsJUiFGf2p5/exec"
PDF_NATIVE = "on"
DEV_ALLOWED_ORIGIN = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lampang-pround-staging"
database_id = "b01db995-9509-457d-ba2b-c49141a37bf8"

[env.production]
name = "lampang-pround"

[env.production.vars]
APP_NAME = "ระบบฐานข้อมูล Lampang Pround"
ORG_NAME = "สำนักงานพัฒนาชุมชน"
SESSION_TTL_SECONDS = "21600"
GUEST_ACCESS_TTL_SECONDS = "21600"
GAS_WEB_APP_URL = ""
IMAGE_STORAGE = "drive"
GAS_DRIVE_ADAPTER_URL = "https://script.google.com/macros/s/AKfycbzDFyTxomXVOG6cbxIQM8Zp_2DIXENHbk0udZ_S6LWGQbws8pvyjQ21BzsJUiFGf2p5/exec"
PDF_NATIVE = "on"
DEV_ALLOWED_ORIGIN = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "lampang-pround"
database_id = "e4bfba6c-cf39-4089-82b8-c7bfdec426ef"
